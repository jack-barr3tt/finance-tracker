when:
  - event: push
    branch: main

concurrency:
  limit: 1

steps:
  - name: lint-frontend
    depends_on: []
    image: node:22-alpine
    commands:
      - corepack enable
      - cd frontend
      - yarn install --frozen-lockfile
      - yarn lint

  - name: lint-backend
    depends_on: []
    image: golangci/golangci-lint:v1.62-alpine
    commands:
      - cd backend
      - golangci-lint run
      - go test ./api/...

  - name: build-frontend
    image: node:22-alpine
    depends_on:
      - lint-frontend
    environment:
      VITE_BACKEND_URL:
        from_secret: vite_backend_url
    commands:
      - corepack enable
      - cd frontend
      - yarn install --frozen-lockfile
      - yarn build

  - name: build-backend
    image: golang:1.23-alpine
    depends_on:
      - lint-backend
    commands:
      - cd backend
      - CGO_ENABLED=0 go build -o finance-tracker .

  - name: package
    image: alpine:3.20
    depends_on:
      - build-frontend
      - build-backend
    commands:
      - mkdir -p release/dist
      - cp backend/finance-tracker release/
      - cp -r frontend/dist/. release/dist/
      - cp scripts/deploy.sh release/
      - chmod +x release/deploy.sh
      - tar -czf release.tar.gz -C release .

  - name: deploy
    image: alpine:3.20
    depends_on:
      - package
    environment:
      SSH_KEY:
        from_secret: deploy_ssh_key
      DEPLOY_HOST:
        from_secret: deploy_host
      DEPLOY_USER:
        from_secret: deploy_user
      DEPLOY_PATH:
        from_secret: deploy_path
    commands:
      - apk add --no-cache openssh-client tar
      - sh scripts/ci-deploy.sh
