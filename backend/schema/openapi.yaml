openapi: 3.0.0
info:
  version: 1.0.0
  title: Finance Tracker API
paths:
  /login:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFound"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFound"
  /signup:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "200":
          description: Sign up response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignupResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotAuthorized"
  /banks:
    get:
      security:
        - BearerAuth: []
      responses:
        "200":
          description: List of banks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Bank"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFound"
  /user/{id}:
    get:
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFound"
  /user/{id}/accounts:
    post:
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountCreateRequest"
      responses:
        "200":
          description: Account response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountCreateResponse"
    get:
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Account response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Account"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFound"
  /user/{id}/accounts/{account_id}:
    get:
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: account_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Account response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "404":
          description: Account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFound"
    patch:
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: account_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountEditRequest"
      responses:
        "200":
          description: Account response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountEditResponse"
        "404":
          description: Account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFound"
    delete:
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: account_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Account response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountDeleteResponse"
        "404":
          description: Account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFound"
  /user/{id}/transactions:
    post:
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionCreateRequest"
      responses:
        "200":
          description: Transaction response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionCreateResponse"
    get:
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: account_id
          in: query
          required: false
          schema:
            type: string
        - name: category_id
          in: query
          required: false
          schema:
            type: string
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Transaction response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionsResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFound"
  /user/{id}/transactions/{transaction_id}:
    get:
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: transaction_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Transaction response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "404":
          description: Transaction not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFound"
    patch:
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: transaction_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionEditRequest"
      responses:
        "200":
          description: Transaction response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionEditResponse"
        "404":
          description: Transaction not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFound"
    delete:
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: transaction_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Transaction response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionDeleteResponse"
        "404":
          description: Transaction not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFound"
  /user/{id}/transactions/bulk:
    post:
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionBulkCreateRequest"
      responses:
        "200":
          description: Bulk transaction response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionBulkResponse"
  /user/{id}/transactions/bulk/finalise:
    post:
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionBulkFinaliseRequest"
      responses:
        "200":
          description: Bulk finalise response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionBulkResponse"
  /user/{id}/transactions/bulk/delete:
    post:
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionBulkDeleteRequest"
      responses:
        "200":
          description: Bulk delete response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionBulkResponse"
  /user/{id}/categories:
    post:
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryCreateRequest"
      responses:
        "200":
          description: Category response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryCreateResponse"
    get:
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Category response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFound"
  /user/{id}/categories/{category_id}:
    get:
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: category_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Category response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "404":
          description: Category not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFound"
    patch:
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: category_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryEditRequest"
      responses:
        "200":
          description: Category response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryEditResponse"
        "404":
          description: Category not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFound"
    delete:
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: category_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Category response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryDeleteResponse"
        "404":
          description: Category not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFound"
  /user/{id}/categories/{category_id}/rules:
    post:
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: category_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryAddRuleRequest"
      responses:
        "200":
          description: Category rule added response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryAddRuleResponse"
  /user/{id}/categories/{category_id}/rules/{rule_id}:
    patch:
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: category_id
          in: path
          required: true
          schema:
            type: string
        - name: rule_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryEditRuleRequest"
      responses:
        "200":
          description: Category rule edited response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryEditRuleResponse"
        "404":
          description: Rule not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFound"
    delete:
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: category_id
          in: path
          required: true
          schema:
            type: string
        - name: rule_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Category rule deleted response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryEditRuleResponse"
        "404":
          description: Rule not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFound"
  /user/{id}/summary/accounts:
    get:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Account summary response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllAccountSummary"
  /user/{id}/summary/categories:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Category summary response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategorySummary"
  /user/{id}/summary/balance:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: group_by
        in: query
        required: false
        schema:
          $ref: "#/components/schemas/SummaryGroupBy"
    get:
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Balance summary response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalanceSummary"
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    # Requests
    LoginRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required:
        - email
        - password
    SignupRequest:
      type: object
      properties:
        email:
          type: string
          example: user@example.com
        password:
          type: string
        master_key:
          type: string
        salt:
          type: string
      required:
        - email
        - password
        - master_key
        - salt
    AccountCreateRequest:
      type: object
      properties:
        name:
          type: string
          example: "Checking Account"
        bank_id:
          type: string
        opened_at:
          type: string
          format: date-time
      required:
        - name
        - bank_id
        - opened_at
    AccountEditRequest:
      type: object
      properties:
        name:
          type: string
          example: "Checking Account"
        bank_id:
          type: string
        opened_at:
          type: string
          format: date-time
        closed_at:
          type: string
          format: date-time
    CategoryCreateRequest:
      type: object
      properties:
        name:
          type: string
      required:
        - name
    CategoryEditRequest:
      type: object
      properties:
        name:
          type: string
      required:
        - name
    CategoryAddRuleRequest:
      type: object
      properties:
        account_id:
          type: string
        description:
          type: string
        rule:
          type: string
    CategoryEditRuleRequest:
      type: object
      properties:
        account_id:
          type: string
        description:
          type: string
        rule:
          type: string
    TransactionCreateRequest:
      type: object
      properties:
        account_id:
          type: string
        amount:
          type: number
          example: 100.00
        category_id:
          type: string
        description:
          type: string
        date:
          type: string
          format: date-time
      required:
        - account_id
        - amount
        - description
        - date
    TransactionEditRequest:
      type: object
      properties:
        account_id:
          type: string
        amount:
          type: number
          example: 100.00
        category_id:
          type: string
        description:
          type: string
        date:
          type: string
          format: date-time
    TransactionBulkCreateRequest:
      type: object
      properties:
        hash:
          type: string
        transactions:
          type: array
          items:
            $ref: "#/components/schemas/TransactionCreateRequest"
      required:
        - hash
        - transactions
    TransactionBulkFinaliseRequest:
      type: object
      properties:
        hash:
          type: string
      required:
        - hash
    TransactionBulkDeleteRequest:
      type: object
      properties:
        hash:
          type: string
        cancel:
          type: boolean
          default: false
      required:
        - hash
    # Responses
    LoginResponse:
      type: object
      properties:
        id:
          type: string
        token:
          type: string
        master_key:
          type: string
        salt:
          type: string
      required:
        - id
        - token
        - master_key
        - salt
    SignupResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message
    AccountCreateResponse:
      type: object
      properties:
        id:
          type: string
      required:
        - id
    AccountEditResponse:
      type: object
      properties:
        id:
          type: string
      required:
        - id
    AccountDeleteResponse:
      type: object
      properties:
        id:
          type: string
        message:
          type: string
      required:
        - id
        - message
    CategoryCreateResponse:
      type: object
      properties:
        id:
          type: string
      required:
        - id
    CategoryEditResponse:
      type: object
      properties:
        id:
          type: string
      required:
        - id
    CategoryDeleteResponse:
      type: object
      properties:
        id:
          type: string
        message:
          type: string
      required:
        - id
        - message
    CategoryAddRuleResponse:
      type: object
      properties:
        id:
          type: string
      required:
        - id
    CategoryEditRuleResponse:
      type: object
      properties:
        id:
          type: string
      required:
        - id
    CategoryDeleteRuleResponse:
      type: object
      properties:
        id:
          type: string
        message:
          type: string
      required:
        - id
        - message
    TransactionsResponse:
      type: object
      properties:
        transactions:
          type: array
          items:
            $ref: "#/components/schemas/Transaction"
        cursor:
          type: string
      required:
        - transactions
    TransactionCreateResponse:
      type: object
      properties:
        id:
          type: string
      required:
        - id
    TransactionEditResponse:
      type: object
      properties:
        id:
          type: string
      required:
        - id
    TransactionDeleteResponse:
      type: object
      properties:
        id:
          type: string
        message:
          type: string
      required:
        - id
        - message
    TransactionBulkResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message
    # Errors
    NotAuthorized:
      type: object
      properties:
        message:
          type: string
          const: "Not authorized"
    NotFound:
      type: object
      properties:
        message:
          type: string
          const: "Not found"
    # Schemas
    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        created_at:
          type: string
          format: date-time
      required:
        - id
        - email
        - created_at
    Account:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        bank:
          $ref: "#/components/schemas/Bank"
        opened_at:
          type: string
          format: date-time
        closed_at:
          type: string
          format: date-time
      required:
        - id
        - name
        - bank
        - opened_at
    Bank:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        short_name:
          type: string
        fixed_products:
          type: boolean
        csv_import_enabled:
          type: boolean
        api_import_enabled:
          type: boolean
      required:
        - id
        - name
        - short_name
        - csv_import_enabled
        - api_import_enabled
    Category:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        created_at:
          type: string
          format: date-time
        rules:
          type: array
          items:
            $ref: "#/components/schemas/CategoryRule"
      required:
        - id
        - name
        - created_at
        - rules
    CategoryRule:
      type: object
      properties:
        id:
          type: string
        account:
          $ref: "#/components/schemas/Account"
        description:
          type: string
        rule:
          type: string
      required:
        - id
        - account
        - rule
    Transaction:
      type: object
      properties:
        id:
          type: string
        amount:
          type: number
        category:
          $ref: "#/components/schemas/Category"
        account:
          $ref: "#/components/schemas/Account"
        description:
          type: string
        date:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
      required:
        - id
        - amount
        - account
        - description
        - date
        - created_at
    AllAccountSummary:
      type: object
      properties:
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/AccountSummary"
        total:
          type: number
      required:
        - accounts
        - total
    AccountSummary:
      type: object
      properties:
        account:
          $ref: "#/components/schemas/Account"
        balance:
          type: number
      required:
        - account
        - balance
    CategorySummary:
      type: object
      properties:
        category:
          $ref: "#/components/schemas/Category"
        total:
          type: number
        percentage:
          type: number
      required:
        - total
        - percentage
    BalanceSummary:
      type: object
      properties:
        total:
          type: array
          items:
            $ref: "#/components/schemas/BalanceDatapoint"
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/BalanceSummaryAccount"
      required:
        - total
        - accounts
    BalanceSummaryAccount:
      type: object
      properties:
        account:
          $ref: "#/components/schemas/Account"
        balance:
          type: array
          items:
            $ref: "#/components/schemas/BalanceDatapoint"
      required:
        - account
        - balance
    BalanceDatapoint:
      type: object
      properties:
        date:
          type: string
          format: date-time
        balance:
          type: number
      required:
        - date
        - balance
    # Enums
    SummaryGroupBy:
      type: string
      enum:
        - day
        - week
