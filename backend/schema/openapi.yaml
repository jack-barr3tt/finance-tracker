components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    # Requests
    LoginRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required:
        - email
        - password
    SignupRequest:
      type: object
      properties:
        email:
          type: string
          example: user@example.com
        password:
          type: string
        master_key:
          type: string
        salt:
          type: string
      required:
        - email
        - password
        - master_key
        - salt
    AccountCreateRequest:
      type: object
      properties:
        name:
          type: string
          example: "Checking Account"
        bank_id:
          type: string
        opened_at:
          type: string
          format: date-time
