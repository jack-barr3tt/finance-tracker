openapi: 3.0.0
info:
  version: 1.0.0
  title: Finance Tracker API
paths:
  /login:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFound"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFound"
  /signup:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "200":
          description: Sign up response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignupResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotAuthorized"
  /user/{id}:
    get:
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFound"
  /user/{id}/accounts:
    post:
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountCreateRequest"
      responses:
        "200":
          description: Account response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountCreateResponse"
    get:
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Account response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Account"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFound"
  /user/{id}/accounts/{account_id}:
    get:
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: account_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Account response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "404":
          description: Account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFound"
    delete:
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: account_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Account response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountDeleteResponse"
        "404":
          description: Account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFound"
  /user/{id}/transactions:
    post:
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionCreateRequest"
      responses:
        "200":
          description: Transaction response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionCreateResponse"
    get:
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: account_id
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Transaction response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transaction"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFound"
  /user/{id}/transactions/{transaction_id}:
    delete:
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: transaction_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Transaction response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionDeleteResponse"
        "404":
          description: Transaction not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFound"
  /user/{id}/categories:
    post:
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryCreateRequest"
      responses:
        "200":
          description: Category response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryCreateResponse"
    get:
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Category response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFound"
  /user/{id}/categories/{category_id}:
    get:
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: category_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Category response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "404":
          description: Category not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFound"
    delete:
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: category_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Category response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryDeleteResponse"
        "404":
          description: Category not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFound"
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    # Requests
    LoginRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required:
        - email
        - password
    SignupRequest:
      type: object
      properties:
        email:
          type: string
          example: user@example.com
        password:
          type: string
          example: password
    AccountCreateRequest:
      type: object
      properties:
        name:
          type: string
          example: "Checking Account"
      required:
        - name
    CategoryCreateRequest:
      type: object
      properties:
        name:
          type: string
          example: "Groceries"
      required:
        - name
    TransactionCreateRequest:
      type: object
      properties:
        account_id:
          type: string
        amount:
          type: number
          example: 100.00
        category_id:
          type: integer
        description:
          type: string
          example: "Milk"
      required:
        - account_id
        - amount
        - category_id
        - description
    # Responses
    LoginResponse:
      type: object
      properties:
        token:
          type: string
        id:
          type: string
      required:
        - token
        - id
    SignupResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message
    AccountCreateResponse:
      type: object
      properties:
        id:
          type: string
      required:
        - id
    AccountDeleteResponse:
      type: object
      properties:
        id:
          type: string
        message:
          type: string
      required:
        - id
        - message
    CategoryCreateResponse:
      type: object
      properties:
        id:
          type: string
      required:
        - id
    CategoryDeleteResponse:
      type: object
      properties:
        id:
          type: string
        message:
          type: string
      required:
        - id
        - message
    TransactionCreateResponse:
      type: object
      properties:
        id:
          type: string
      required:
        - id
    TransactionDeleteResponse:
      type: object
      properties:
        id:
          type: string
        message:
          type: string
      required:
        - id
        - message
    # Errors
    NotAuthorized:
      type: object
      properties:
        message:
          type: string
          const: "Not authorized"
    NotFound:
      type: object
      properties:
        message:
          type: string
          const: "Not found"
    # Schemas
    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        created_at:
          type: string
          format: date-time
      required:
        - id
        - email
        - created_at
    Account:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        created_at:
          type: string
          format: date-time
      required:
        - id
        - name
        - created_at
    Category:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        created_at:
          type: string
          format: date-time
      required:
        - id
        - name
        - created_at
    Transaction:
      type: object
      properties:
        id:
          type: string
        amount:
          type: number
        category:
          $ref: "#/components/schemas/Category"
        description:
          type: string
        date:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
      required:
        - id
        - amount
        - description
        - date
        - created_at
